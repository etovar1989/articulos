services:

  # ─── Servidor Web PHP 8.2 + Apache ──────────────────────────────────────────
  web:
    build: .
    container_name: eduteka_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html                  # código en vivo — cambios se ven al instante
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── PostgreSQL 15 (idéntico al servidor) ────────────────────────────────────
  db:
    image: postgres:15
    container_name: eduteka_db
    ports:
      - "5432:5432"                      # accesible en localhost:5432 desde tu PC
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01_schema.sql   # crea tablas automáticamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── pgAdmin — panel visual de la BD ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eduteka_pgadmin
    ports:
      - "5050:80"                        # http://localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: etovar1989@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASS}
    depends_on:
      - db
    restart: unless-stopped

  # ─── Python tools (para cargar artículos y generar embeddings) ───────────────
  tools:
    image: python:3.11-slim
    container_name: eduteka_tools
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "pip install -r requirements.txt -q &&
               echo 'Tools listas. Usa: docker compose exec tools python tools/load_articles.py'"
    profiles:
      - tools                            # solo se levanta con: docker compose --profile tools up

volumes:
  postgres_data:
