<article>
    <h1>{{ @article['title'] }}</h1>
    <p>
        <time>{{ @article['article_date'] }}</time>
        <check if="{{ @article['original_category'] }}">
            <true> — {{ @article['original_category'] }}</true>
        </check>
    </p>
    <div>{{ @article['body'] | raw }}</div>
</article>
