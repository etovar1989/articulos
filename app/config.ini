; Defaults del proyecto. Sin secretos — lo sensible va en config.local.ini (gitignored).

[globals]
UI="app/views/"
TEMP="tmp/"

; Modelos de IA (coinciden con lo que ya corre en produccion)
OPENAI_CHAT_MODEL="gpt-4.1-mini"
OPENAI_EMBED_MODEL="text-embedding-3-small"

; RAG — ver articulos/lib/chat_general.php y busqueda.php del sitio original
RAG_MAX_DISTANCE=0.75          ; 1 - UMBRAL_SIMILITUD_MINIMA (0.25) de produccion
RAG_TOP_K=8
HNSW_EF_SEARCH=100              ; minimo; se ajusta a max(100, topN*2) por consulta

; Precios OpenAI (USD por millon de tokens) para el calculo de costos del inspector RAG
PRECIO_ENTRADA_POR_M=0.15
PRECIO_SALIDA_POR_M=0.60
