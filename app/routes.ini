[routes]
; Las paginas legacy que aun no se migraron a MVC se siguen sirviendo como archivos
; PHP directos bajo public/ — el .htaccess las deja pasar sin tocar F3 (!-f). Cada
; ruta de aqui corresponde a un archivo que YA se borro de public/ (Fase B en
; adelante de la migracion a MVC): el archivo deja de existir, la peticion cae a
; F3, y esta lista la despacha al controlador real.
GET / = App\Controllers\Home->index

; --- Fase B: endpoints publicos aislados (sin vista, responden JSON/binario) ---
POST /articulos/chat.php = App\Controllers\ArticleController->chatArticulo
POST /articulos/chat_general.php = App\Controllers\ArticleController->chatGeneral
GET /articulos/descargar.php = App\Controllers\ArticleController->descargarPdf
GET /articulos/etiquetas_todas.php = App\Controllers\ArticleController->etiquetasTodas

; --- Fase C: paginas publicas de alto trafico ---
GET /articulos/index.php = App\Controllers\ArticleController->index
GET /articulos/ver.php = App\Controllers\ArticleController->show

; --- Fase E: panel admin completo ---
GET|POST /admin/login.php = App\Controllers\Admin\AuthController->login
GET /admin/logout.php = App\Controllers\Admin\AuthController->logout
GET /admin/index.php = App\Controllers\Admin\DashboardController->index
GET /admin/articulos/index.php = App\Controllers\Admin\ArticleController->index
GET /admin/articulos/form.php = App\Controllers\Admin\ArticleController->form
POST /admin/articulos/guardar.php = App\Controllers\Admin\ArticleController->guardar
POST /admin/articulos/eliminar.php = App\Controllers\Admin\ArticleController->eliminar
GET /admin/categorias/index.php = App\Controllers\Admin\CategoryController->index
POST /admin/categorias/guardar.php = App\Controllers\Admin\CategoryController->guardar
GET /admin/etiquetas/index.php = App\Controllers\Admin\TagController->index
POST /admin/etiquetas/guardar.php = App\Controllers\Admin\TagController->guardar
POST /admin/etiquetas/eliminar.php = App\Controllers\Admin\TagController->eliminar
POST /admin/etiquetas/fusionar.php = App\Controllers\Admin\TagController->fusionar
GET /admin/metricas/index.php = App\Controllers\Admin\MetricsController->index
GET /admin/metricas/busquedas.php = App\Controllers\Admin\MetricsController->busquedas
GET /admin/metricas/preguntas.php = App\Controllers\Admin\MetricsController->preguntas
GET|POST /admin/rag/index.php = App\Controllers\Admin\RagController->index
